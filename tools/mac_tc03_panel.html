<!doctype html>
<html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width">
<title>TC-03 API検証</title>
<style>body{font:16px system-ui;margin:24px;max-width:1000px}button{padding:12px;margin:8px}pre{white-space:pre-wrap;border:1px solid #aaa;padding:16px}a{display:inline-block;margin:12px}</style>
<h1>TC-03 API検証</h1>
<p>今回の隔離環境で、通常の認証と中継を通して確認します。Cookieは読取・表示しません。</p>
<a href="/">通常のPOSを開く</a>
<button id="state">状態を取得</button>
<button id="blocked">4操作を直接要求</button>
<button id="lookup">会員GETを直接照会</button>
<button id="member">MEMBER_0を新しく指定</button>
<button id="nonmember">非会員を新しく選択</button>
<p role="status" id="status">待機中</p>
<pre id="result" aria-label="API検証結果"></pre>
<script>
const buttons = [...document.querySelectorAll('button')];
const output = document.querySelector('#result');
async function request(method,path,body) {
  const response = await fetch('/api/'+path,{method,credentials:'same-origin',cache:'no-store',
    signal:AbortSignal.timeout(15000),headers:method==='GET'?{}:{'X-POS-Request':'1',...(body?{'Content-Type':'application/json'}:{})},
    body:body?JSON.stringify(body):undefined});
  return {method,path,body:body??null,status:response.status,value:await response.json()};
}
async function current() {
  const response=await request('GET','resume');
  if(response.status!==200) throw new Error('認証・復帰を確認できません');
  return response.value;
}
async function run(action) {
  buttons.forEach(button=>button.disabled=true);
  document.querySelector('#status').textContent='確認中';
  const record={at_utc:new Date().toISOString(),action,requests:[]};
  try {
    const before=await current(); record.before=before;
    if(action==='blocked') {
      if(before.cart.member_state!=='PENDING'||before.cart.lines.length===0) throw new Error('商品ありPENDINGが必要です。要求は送信しません');
      const cart=before.cart, line=cart.lines[0];
      const commands=[['POST',`carts/${cart.cart_id}/lines`,{code:'0001'}],
        ['PATCH',`carts/${cart.cart_id}/lines/${line.line_id}`,{quantity:4}],
        ['DELETE',`carts/${cart.cart_id}/lines/${line.line_id}`,null],
        ['POST','purchases',{cart_id:cart.cart_id}]];
      for(const [method,path,extra] of commands) {
        const operation_id=crypto.randomUUID(),version=cart.version;
        const target=method==='DELETE'?`${path}?operation_id=${operation_id}&version=${version}`:path;
        const response=await request(method,target,method==='DELETE'?undefined:{operation_id,version,...extra});
        record.requests.push(response);
        // Stop immediately if a forbidden write unexpectedly succeeds.
        if(response.status!==409||response.value.code!=='STATE_CONFLICT') throw new Error('期待したSTATE_CONFLICTではありません。停止します');
      }
    } else if(action==='lookup') {
      if(before.cart.member_state!=='PENDING') throw new Error('PENDINGが必要です。要求は送信しません');
      record.requests.push(await request('GET','members/MEMBER_0'));
    } else if(action==='member'||action==='nonmember') {
      if(before.cart.member_state!=='PENDING') throw new Error('PENDINGが必要です。要求は送信しません');
      const response=await request('PUT',`carts/${before.cart.cart_id}/member`,{
        operation_id:crypto.randomUUID(),version:before.cart.version,
        member_id:action==='member'?'MEMBER_0':null});
      record.requests.push(response);
      if(response.status!==200||response.value.operation_status!=='APPLIED') throw new Error('新選択の確定を確認できません');
    }
    record.after=await current(); record.completed=true;
    document.querySelector('#status').textContent='確認完了';
  } catch(error) {
    record.completed=false; record.error=error.message;
    document.querySelector('#status').textContent='確認失敗・停止';
  } finally {
    record.finished_at_utc=new Date().toISOString();
    output.textContent=JSON.stringify(record,null,2);
    buttons.forEach(button=>button.disabled=false);
  }
}
document.querySelector('#state').onclick=()=>run('state');
document.querySelector('#blocked').onclick=()=>run('blocked');
document.querySelector('#lookup').onclick=()=>run('lookup');
document.querySelector('#member').onclick=()=>run('member');
document.querySelector('#nonmember').onclick=()=>run('nonmember');
</script></html>
